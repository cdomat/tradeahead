[theme]
base = "light"
primaryColor = "#B8501E"
backgroundColor = "#F6F4EE"
secondaryBackgroundColor = "#FDFCF8"
textColor = "#0F2A2E"
borderColor = "#E9E5DA"
baseRadius = "8px"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
